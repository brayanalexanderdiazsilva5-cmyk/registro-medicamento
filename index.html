<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Medicamentos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input, button {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background: #0077b6;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #005a8d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Registrar Medicamento 📦</h1>
        <form id="form-medicamento">
            <input type="text" id="medicamento" placeholder="Nombre del medicamento" required>
            <input type="number" id="cantidad" placeholder="Cantidad" required>
            <input type="text" id="lote" placeholder="Número de lote">
            <button type="submit">Registrar y Notificar</button>
        </form>
    </div>

    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
